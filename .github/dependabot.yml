version: 2
updates:
  # npm — frontend dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      # @mantine/core pins an exact peer on @mantine/hooks, so split PRs
      # produce an ERESOLVE conflict. Always bump the pair together.
      mantine:
        patterns:
          - "@mantine/*"

      # React 19 refuses to run when react and react-dom resolve to different
      # versions: createRoot throws "Minified React error #527" before anything
      # mounts, and with no error boundary above it the whole UI is a blank page.
      # tsc, eslint and `vite build` all pass on a skew — it only fails in a
      # browser, which nothing in CI exercises. v1.1.1 shipped exactly this
      # (react 19.2.8 / react-dom 19.2.7, from a solo react bump) and was DOA.
      # Always bump the pair together. Names are listed exactly, not as
      # "react*", so react-i18next keeps getting its own independent PR.
      react:
        patterns:
          - "react"
          - "react-dom"

  # uv/pip — Python backend dependencies. This block DOES cover Python; the
  # boto3/openai/fastapi/etc. bumps come from here. Note: Dependabot opens uv
  # *version* PRs, but its *security*-update support for the uv ecosystem lags,
  # so alert-driven security PRs (e.g. Pillow) may need a manual bump until then.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      # Nearly every Python bump rewrites uv.lock, and branch protection
      # requires branches to be up to date, so ungrouped PRs can only merge one
      # at a time: each merge invalidates all the others, forcing a rebase and a
      # full pytest re-run apiece.  Ten separate bumps meant ten serialised
      # rebase/CI/merge cycles.  Batching minor+patch into one PR makes that a
      # single rebase, a single CI run and a single merge.
      #
      # Majors are deliberately NOT grouped: they carry the real breaking-change
      # risk (qdrant-client 1.19 removed `add`/`query`; cryptography 50
      # deprecated FFDH), and one bad major in a batch would block every safe
      # bump riding along with it.  They keep getting individual PRs so they can
      # be reviewed, and reverted, on their own.
      #
      # `groups` defaults to applies-to: version-updates, so Dependabot's
      # security PRs stay separate and keep landing immediately.
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used by the CI/release workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
