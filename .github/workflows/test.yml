name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Restore Hypothesis example database
        uses: actions/cache@v6
        with:
          path: .hypothesis
          # Accumulates on the branch; falls back to main so CI builds on prior findings.
          key: hypothesis-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            hypothesis-${{ github.ref_name }}-
            hypothesis-main-

      - name: Audit Python dependencies
        run: uvx pip-audit

      - name: Lint backend (ruff)
        run: uv run ruff check backend

      - name: Security scan backend (bandit)
        run: uv run bandit -rq backend --severity-level medium

      - name: Run pytest
        run: uv run pytest -q

  frontend:
    name: Frontend (tsc + i18n + audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch base branch ref
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch origin "$BASE_REF" --depth=1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint (eslint)
        run: npm run lint

      - name: i18n completeness check
        run: npm run check:i18n

      # Audit runs LAST on purpose.  When it ran first, a single advisory
      # published against an unchanged dependency (nanoid, 2026-08-08) turned
      # twelve open PRs red and suppressed all tsc/eslint/i18n signal on every
      # one of them for six days.  Type and lint results must never be hidden
      # behind a dependency advisory.
      #
      # It also only fails on advisories this PR *introduces*; advisories
      # already on main are tracked by .github/workflows/audit-sweep.yml.
      - name: Audit dependencies (new advisories only)
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: python3 .github/scripts/check-npm-audit-delta.py
